# ===================== Blueprint 10 – Crypto Narrative & NLP Sentiment =====================
contact_email: ""          # KHÔNG điền ở đây (repo public): dùng env CONTACT_EMAIL hoặc config/config.local.yaml
seed: 42

sample:
  start: "2023-01-01"      # ≥ 2–3 năm daily (mục 3.4 blueprint)
  end: "2026-09-30"
  assets: [BTC, ETH, SOL, BNB, XRP]
  market_tz: UTC           # crypto 24/7: ngày = 00:00–24:00 UTC; mọi timestamp quy về UTC

split:                     # out-of-sample KHÔNG chạm tới khi tuning (mục 2.8)
  train_end: "2025-06-30"
  valid_end: "2025-12-31"  # test = (valid_end, sample.end]

text:
  primary_lang: en         # NGUYÊN TẮC: tiếng Anh + thư viện chuẩn quốc tế là nhánh CHÍNH
  sources: [gdelt, rss, sec]   # docs/SOURCES.md: CryptoPanic trả phí → loại; RSS chỉ live (ngoài mẫu)
  vn_branch: true          # nhánh phụ: tin tiếng Việt → từ điển tài chính tiếng Việt (dict/fin_vn.csv + crypto_vn.csv)
  dedup_threshold: 0.9     # tương đồng tiêu đề ≥ ngưỡng → coi là trùng, giữ bản CÔNG BỐ SỚM NHẤT
  vn_source_tz: Asia/Ho_Chi_Minh

nlp:
  finbert_model: ProsusAI/finbert
  narratives: [regulation, etf_institutional, security_hacks, stablecoins, defi, ai_tokens, macro_monetary, price_speculation]
  llm:                     # tái dùng src/utils/llm_client.py (zero-shot narrative) – key ở .env
    enabled: false
    provider: gemini
    fallback_provider: claude
    model_gemini: gemini-3.5-flash-lite
    model_claude: claude-haiku-4-5
    requests_per_minute: 10
    max_total_calls: 2000
    max_retries: 4
    max_consecutive_failures: 3

model:
  horizons: [1, 3, 7]      # h ngày
  hac_lags: 7              # Newey–West
  var_maxlags: 7

event:                     # dùng cho src/evaluation/event_study.py (port từ disclosure-tone-car)
  est_window: [-150, -11]
  min_est_obs: 80
  windows: [[0, 1], [0, 3], [-1, 1]]
  main_window: [0, 1]
  placebo_shift: -60
  caar_path: [-10, 10]
