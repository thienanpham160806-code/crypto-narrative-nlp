<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#F8FAFC;color:#0F172A;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:240px 1fr;height:900px}
aside{background:#fff;border-right:1px solid #E2E8F0;padding:20px 12px}
aside b{display:block;padding:0 12px 20px;font-size:16px}
aside a{display:block;padding:9px 12px;border-radius:6px;color:#475569;text-decoration:none}
aside a.on{background:#EFF6FF;color:#2563EB;font-weight:600}
main{padding:24px 32px}
.top{display:flex;align-items:center;margin-bottom:20px}.top h1{font-size:22px;margin-right:auto}
.top span{border:1px solid #CBD5E1;border-radius:6px;padding:6px 12px;margin-left:8px;background:#fff}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:20px}
.k{background:#fff;border:1px solid #E2E8F0;border-radius:10px;padding:16px}
.k small{color:#64748B}.k strong{display:block;font-size:24px;margin-top:4px}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.c{background:#fff;border:1px solid #E2E8F0;border-radius:10px;padding:16px;height:300px;position:relative}
.c h3{font-size:15px}
svg{position:absolute;left:16px;right:16px;bottom:16px;top:48px;width:calc(100% - 32px);height:calc(100% - 64px)}
</style></head><body><div class="app">
<aside><b>Crypto Narrative</b><a class="on" href="#">Tổng quan</a><a href="#">Narratives</a><a href="#">Sentiment</a><a href="#">Coins</a><a href="#">Dự báo</a><a href="#">Timing</a><a href="#">Live</a></aside>
<main><div class="top"><h1>Tổng quan</h1><span>VI / EN</span><span>Theme</span></div>

<div class="charts">
<div class="c"><h3>Narrative trends</h3><svg viewBox="0 0 600 220" preserveAspectRatio="none"><path d="M0 180 C100 160 200 100 300 120 S500 60 600 80" stroke="#2563EB" stroke-width="2" fill="none"/><path d="M0 200 C120 190 220 170 330 140 S520 150 600 130" stroke="#94A3B8" stroke-width="2" fill="none"/></svg></div>

</div></main></div></body></html>
